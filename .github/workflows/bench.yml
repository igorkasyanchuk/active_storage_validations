name: Bench

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmarks:
    name: Benchmarks (${{ matrix.image_processor }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image_processor:
          - vips
          - mini_magick
    env:
      IMAGE_PROCESSOR: ${{ matrix.image_processor }}
      BENCH_TIME: "3"
      BENCH_WARMUP: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # mfinelli/setup-imagemagick gets a 404 from ImageMagick's releases since
      # 7.1.2-36, so install that release's AppImage directly: pinned version,
      # checksum from the release asset's published digest.
      - name: Install imagemagick
        env:
          IMAGEMAGICK_VERSION: 7.1.2-36
          IMAGEMAGICK_SHA256: 68cca0053a8f82206e72400014f32f4b654e9807f45928a2325a1d14d695fb3a
        run: |
          sudo apt-get install -y libfuse2t64
          curl -fsSL -o magick "https://github.com/ImageMagick/ImageMagick/releases/download/${IMAGEMAGICK_VERSION}/ImageMagick-${IMAGEMAGICK_VERSION}-x86_64.AppImage"
          echo "${IMAGEMAGICK_SHA256}  magick" | sha256sum --check
          chmod +x magick
          sudo mv magick /usr/local/bin/magick

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get -y install libvips libvips-tools ffmpeg poppler-utils

      - name: Setup Ruby and install gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Ensure benchmark gems
        run: |
          bundle config set --local with benchmark
          bundle install

      - name: Run require benchmark
        run: bundle exec ruby benchmark/require.rb | tee require-${{ matrix.image_processor }}.txt

      - name: Run metadata validator benchmarks
        run: bundle exec ruby benchmark/metadata_validators.rb | tee metadata-${{ matrix.image_processor }}.txt

      - name: Run image processor comparison
        if: matrix.image_processor == 'vips'
        run: bundle exec ruby benchmark/image_processors.rb | tee image-processors.txt

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-report-${{ matrix.image_processor }}
          path: |
            require-${{ matrix.image_processor }}.txt
            metadata-${{ matrix.image_processor }}.txt

      - name: Upload image processor comparison
        if: matrix.image_processor == 'vips'
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-report-image-processors
          path: image-processors.txt
