inherit_from: .rubocop_todo.yml

inherit_gem:
  rubocop-rails-omakase: rubocop.yml

AllCops:
  TargetRubyVersion: 3.4.9 # same as .github/workflows/main.yml
  Exclude:
    - 'bin/*'
    - 'config/locales/*'
    - 'gemfiles/*'
    - 'lib/tasks/*'
    - 'vendor/bundle/**/*'
  NewCops: enable

plugins:
  - rubocop-performance
  - rubocop-rspec

# ==============================================================================
# Cops

# Style cops

Style/Documentation:
  Enabled: false

# Metrics cops

Metrics/AbcSize:
  Severity: warning

Metrics/MethodLength:
  Max: 15

Metrics/BlockLength:
  Exclude:
    - test/**/*
    - spec/**/*


Rails/AssertNot:
  Enabled: false

Rails/RefuteMethods:
  Enabled: false

# ==============================================================================
# RSpec cops
#
# Re-enabled where the suite is clean or cheap to keep clean.
# Remaining disables are intentional for this suite's shape / DSL.

RSpec/DescribeClass:
  Exclude:
    - spec/**/integration/**/*
    - spec/integration/**/*

# Suite boot banner (not an example)
RSpec/Output:
  Exclude:
    - spec/rails_helper.rb

# Comparison matrices nest deeply; default Max 3 is too low for this suite
RSpec/NestedGroups:
  Max: 7

RSpec/MultipleExpectations:
  Enabled: false

RSpec/ExampleLength:
  Max: 15
  CountAsOne:
    - array
    - hash

RSpec/MultipleMemoizedHelpers:
  Enabled: false

# Nested contexts continue with and/which/that/but (see .cursor/rules/spec.mdc)
RSpec/ContextWording:
  Prefixes:
    - when
    - with
    - without
    - and
    - which
    - that
    - but

# Validators create analyzers internally — allow_any_instance_of is the seam
RSpec/AnyInstance:
  Enabled: false

# Custom helpers (is_expected_to_be_valid, etc.) wrap expect — RuboCop cannot see them
RSpec/NoExpectationExample:
  Enabled: false

# Flat layout: spec/validators/size_validator_spec.rb (not nested by module path)
RSpec/SpecFilePathFormat:
  Enabled: false

# Shared example modules / dynamic groups look empty to the cop
RSpec/EmptyExampleGroup:
  Enabled: false

# Comparison option matrices repeat similar bodies by design
RSpec/RepeatedExampleGroupBody:
  Enabled: false

# file_1 / file_2 style lets are clearer than renaming for this suite
RSpec/IndexedLet:
  Enabled: false
